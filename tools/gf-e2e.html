<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gf-e2e</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: #211c18; }
  /* 模拟 Obsidian 主题提供的标准变量（真实环境一定有）。
     缺了它们，插件里 var(--interactive-accent) / var(--background-secondary) 这类引用
     会整条失效——断言就会「因为变量不存在而通过或失败」，测不出真实观感。 */
  :root {
    --interactive-accent: #7c5cff;
    --interactive-accent-hover: #6b4bf0;
    --text-on-accent: #ffffff;
    --text-normal: #22252b;
    --text-muted: #6b7280;
    --text-faint: #9aa1ac;
    --text-accent: #7c5cff;
    --background-primary: #ffffff;
    --background-secondary: rgba(0, 0, 0, 0.04);
    --background-modifier-border: rgba(0, 0, 0, 0.12);
    --background-modifier-border-focus: rgba(0, 0, 0, 0.25);
    --background-modifier-hover: rgba(0, 0, 0, 0.06);
    --background-modifier-form-field: rgba(0, 0, 0, 0.03);
    --background-modifier-form-field-highlighted: rgba(0, 0, 0, 0.08);
  }
  /* 固定舞台：900px 高保证架子可滚动（相机平移/回位可测） */
  #mount { width: 1180px; height: 900px; margin: 0 auto; }
  /* 不要把 .mw-view 的高度写死：产品用 height: calc(100% / var(--mw-zoom))
     做缩放反除补偿，这里再声明 height 会把它盖掉（缩放后就不是精确填满了） */
  /* 模拟 Obsidian/主题对裸 <button> 的默认样式。
     刻意用 (0,1,2) 这种「低特异性」写法（body + button + :not(类)）：
     真实主题的基础规则就是这个量级，插件用双类选择器的硬重置（如
     .mw-gf__bar .mw-gf__tool）应当能压过它；而只带单个类的图标钮压不过，
     因此必须靠 Obsidian 自带的 .clickable-icon 来豁免 —— 这正是产品代码的做法。
     用 #id 或 .mw-view 前缀会人为抬高特异性，测出来的就不是真实观感了。 */
  body button:not(.clickable-icon) {
    background-color: #eef0f4;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.25);
    border: 1px solid #d8dbe2;
    padding: 6px 14px;
    border-radius: 6px;
    min-height: 30px;
    color: #222;
  }
  #result {
    position: fixed; right: 8px; top: 8px; z-index: 99999;
    background: #14100c; color: #eee; font: 15px/1.8 Consolas, monospace;
    padding: 10px 12px; max-width: 640px; max-height: 80vh; overflow: auto;
    border: 2px solid #666; border-radius: 8px;
    /* 结果面板是调试浮层，绝不能拦命中测试：拖拽落点用 elementFromPoint 判定，
       面板盖住的区域会让落点变成 null（分组头横跨整行，中心点必然被盖住） */
    pointer-events: none;
  }
  #result .ok { color: #8fd98f; }
  #result .bad { color: #ff9090; }

  /*
   * 模拟 Perspective：真实主题的特异性比上面的基线高得多，第五轮反馈的
   * 「输入框 hover 变白 / 清空图标紫色圆 / 搜索按钮紫色」全都来自这里：
   *   .theme-light input[type='search']:hover   (0,3,1)  → 压过我们的单/双类规则
   *   .theme-light button:not(.clickable-icon)  (0,2,1)  → 白底药丸
   *   .theme-light .clickable-icon              (0,2,0)  → 强调色实心圆
   * 只在 body.mw-theme-strict 下生效：其它场景保持低特异性基线，
   * theme-resist 场景专门验证「面板控件能否压过真实主题」。
   */
  body.mw-theme-strict input[type="search"],
  body.mw-theme-strict input[type="text"] {
    background-color: #ffffff;
    border: 1px solid #d8dbe2;
    color: #222;
  }
  body.mw-theme-strict input[type="search"]:hover,
  body.mw-theme-strict input[type="text"]:hover {
    background-color: #ffffff;
    border-color: #b9c0cc;
  }
  body.mw-theme-strict button:not(.clickable-icon) {
    background-color: #eef0f4;
    border: 1px solid #d8dbe2;
    color: #222;
  }
  body.mw-theme-strict button:not(.clickable-icon):hover {
    background-color: #e2e6ee;
  }
  body.mw-theme-strict .clickable-icon {
    background-color: #7c5cff;
    color: #ffffff;
    border-radius: 50%;
  }
  body.mw-theme-strict .clickable-icon:hover {
    background-color: #6b4bf0;
  }

  /* 模拟主题给 .view-content 加的内边距（第五轮 A4「留白」的根因）。
     只在 body.mw-viewpad 下生效，由 wall-edges 场景单独开关。 */
  body.mw-viewpad .view-content {
    padding: 12px 12px 32px;
  }

  /* 模拟 Obsidian 的模态层（真实环境由 Obsidian 基础样式提供；harness 里没有，
     弹窗会掉进普通文档流、跑到页面底部）。有它才能测弹窗的居中、宽度与缩放。 */
  .modal-container {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.4);
  }
  .modal {
    position: relative;
    width: 100%; max-width: 560px;
    padding: 20px 22px;
    border-radius: 12px;
    background: var(--background-primary, #fff);
    color: var(--text-normal, #222);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<div id="mount"></div>
<div id="result">running…</div>
<script src="./gf-e2e.bundle.js"></script>
</body>
</html>
