<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: #1e1e22; }
  .mw-view { height: 100vh; }
</style>
</head>
<body class="is-desktop">
<div class="mw-view mw-shelfcap-pull">
  <div class="mw-toolbar">
    <div class="mw-toolbar__left"><div class="mw-toolbar__title">验收墙</div></div>
  </div>
  <div class="mw-stage" id="stage">
    <div class="mw-grid mw-grid--shelf" style="--mw-min-col:180px" id="grid"></div>
    <div class="mw-shelf-detail" id="detail"></div>
  </div>
</div>
<script>
"use strict";
const NAMES = ["范特西","叶惠美","七里香","八度空间","十一月的萧邦","跨时代","哎呦不错哦","魔杰座","依然范特西","十二新作","最伟大的作品","奇迹"];
function cover(i, name){
  const h=(i*53+10)%360;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><defs><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},48%,45%)'/><stop offset='1' stop-color='hsl(${(h+40)%360},55%,16%)'/></linearGradient></defs><rect width='300' height='300' fill='url(#c)'/><circle cx='230' cy='72' r='44' fill='hsla(${h},70%,80%,0.45)'/><text x='16' y='280' font-family='sans-serif' font-size='24' fill='rgba(255,255,255,0.92)'>${name}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function disc(i){
  return `<div class="mw-disc mw-disc--vinyl"><div class="mw-record"><div class="mw-record__plate"><div class="mw-record__label"><img src="${cover(i,"")}" alt=""></div><div class="mw-record__center"></div></div></div></div>`;
}
const grid = document.getElementById("grid");
NAMES.forEach((n,i)=>{
  const card=document.createElement("div");
  card.className="mw-card mw-shelf-card";
  const vinyl = i%2===0 ? `<div class="mw-shelf-vinyl">${disc(i)}</div>` : "";
  card.innerHTML = `
    <div class="mw-shelf-slot">${vinyl}
      <div class="mw-shelf-jacket"><img src="${cover(i,n)}" alt="${n}"></div>
    </div>
    <div class="mw-shelf-cap"><div class="mw-shelf-cap__name">${n}</div><div class="mw-shelf-cap__artist">艺术家 ${i+1}</div></div>`;
  card.addEventListener("click", () => openDetail(n, i));
  grid.appendChild(card);
});
if(location.search.includes("pulled")) grid.children[2].classList.add("is-pulled");

function fmtDur(ms){ const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function openDetail(n, i){
  const d = document.getElementById("detail");
  d.innerHTML = `
    <div class="mw-shelf-detail__back">←</div>
    <div class="mw-shelf-detail__left">
      <div class="mw-shelf-detail__sleeve">
        <div class="mw-shelf-vinyl mw-shelf-detail__vinyl">${disc(i)}</div>
        <div class="mw-shelf-jacket mw-shelf-detail__jacket"><img src="${cover(i,n)}" alt="${n}"></div>
      </div>
    </div>
    <div class="mw-shelf-detail__right">
      <div class="mw-shelf-detail__name">${n}</div>
      <div class="mw-shelf-detail__artist">艺术家 ${i+1}</div>
      <div class="mw-shelf-detail__year">发行于 202${i%6}</div>
      <div class="mw-shelf-detail__tags"><span class="mw-shelf-detail__tag">史诗</span><span class="mw-shelf-detail__tag">器乐</span></div>
      <div class="mw-shelf-detail__actions">
        <button class="mw-btn mw-btn--primary mw-shelf-detail__play">播放整张</button>
        <button class="mw-btn">编辑</button><button class="mw-btn">迁移</button>
        <button class="mw-btn">复制链接</button><button class="mw-btn">删除</button>
      </div>
      <div class="mw-shelf-detail__desc">Life 是一部令人惊叹的音乐作品集，既全面而内敛，精致同时感性，由布拉格管弦乐团和合唱团现场录制，如同其名，充满了奇迹、美丽、痛苦和胜利。</div>
      <div class="mw-shelf-detail__tracks">
        ${Array.from({length:28},(_,t)=>`<div class="mw-shelf-detail__track"><span class="mw-shelf-detail__trackNo">${t+1}</span><span class="mw-shelf-detail__trackName">第 ${t+1} 首曲目名称示例</span><span class="mw-shelf-detail__trackDur">${fmtDur(210000+t*7000)}</span></div>`).join("")}
      </div>
    </div>`;
  d.querySelector(".mw-shelf-detail__back").addEventListener("click", ()=>{ d.classList.remove("is-open"); stage.classList.remove("is-detail"); });
  document.getElementById("stage").classList.add("is-detail");
  d.classList.add("is-open");
}
if(location.search.includes("detail")) openDetail("七里香", 2);
if(location.search.includes("pull")){
  const st=document.createElement("style");
  st.textContent=".mw-shelf-detail__sleeve .mw-shelf-detail__vinyl{transform:translateY(38%) !important}";
  document.head.appendChild(st);
  if(!location.search.includes("detail")) openDetail("Gift of Life", 0);
}

if(location.search.includes("menu")){
  const menu=document.createElement("div");
  menu.className="mw-shelf-menu";
  menu.style.left="320px"; menu.style.top="220px";
  menu.innerHTML = `<div class="mw-shelf-menu__item">播放</div><div class="mw-shelf-menu__item">编辑元数据</div><div class="mw-shelf-menu__item">迁移到其他墙…</div><div class="mw-shelf-menu__item">复制专辑链接</div><div class="mw-shelf-menu__item is-danger">删除</div>`;
  document.body.appendChild(menu);
}
</script>
</body>
</html>
