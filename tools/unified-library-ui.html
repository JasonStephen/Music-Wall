<!doctype html><html><head><meta charset="utf-8"><title>Music Wall</title><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:var(--background-primary);color:var(--text-normal)}
.theme-light{--background-primary:#fafafa;--background-secondary:#eee;--text-normal:#222;--text-muted:#666;--text-faint:#888;--background-modifier-border:#ddd;--background-modifier-hover:#eee}
.theme-dark{--background-primary:#202124;--background-secondary:#292b30;--text-normal:#eee;--text-muted:#bbb;--text-faint:#888;--background-modifier-border:#555;--background-modifier-hover:#ffffff18}
body{--interactive-accent:#d64a53;--text-accent:#d64a53;--text-on-accent:white}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}svg{width:18px;height:18px}
#mount{height:100vh;width:100vw;display:flex;min-width:0}#mount>.view-content{flex:1;min-width:0;height:100%}.modal-container{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0004}.modal{padding:20px;background:var(--background-primary);border-radius:12px;width:min(500px,90vw)}
</style></head><body class="theme-light"><div id="mount"></div><script src="unified-library-ui.bundle.js"></script></body></html>
